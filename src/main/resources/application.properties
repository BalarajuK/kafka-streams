spring.application.name=kafka-streams
server.port=8095

#spring.kafka.producer.bootstrap-server=localhost:9092
spring.kafka.schema.registry.url=localhost:8081
spring.kafka.consumer.bootstrap-servers: localhost:9092

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=com.meghasys.kstream.kafka_streams.kafka.CallbackDeserializer

spring.kafka.consumer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.value-serializer=com.meghasys.kstream.kafka_streams.kafka.CallbackSerializer
spring.kafka.consumer.group-id=user-group
